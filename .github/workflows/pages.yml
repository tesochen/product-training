name: Deploy training slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R . _site/
          rm -rf _site/.git _site/.github
          if [ ! -f _site/index.html ]; then
            echo '<meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./ovid-discovery-ai/"> <a href="./ovid-discovery-ai/">Open slides</a>' > _site/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
